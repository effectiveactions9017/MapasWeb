<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Predial Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css" />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuentes y estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css" rel="stylesheet">
  <script async defer src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js"></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />

  <!-- Ajuste para que la leyenda siempre se vea -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Libre Franklin', Arial, sans-serif;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #legend-terri {
      position: absolute;
      bottom: 25px;
      left: 15px;
      z-index: 9999;
    }

    .info-box {
      z-index: 9998;
    }
  </style>
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- LEYENDA DINÁMICA -->
  <div id="legend-terri"></div>

  <!-- CAJA DE INFORMACIÓN -->
  <div class="info-box">
    <h3>Información del predio</h3>
    <div class="info-content">
      Busca un predio para ver detalles
    </div>
  </div>

  <!-- JS PRINCIPAL -->
  <script src="../src/index.js"></script>

</body>
</html>

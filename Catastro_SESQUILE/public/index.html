<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catastro Sesquilé - Predial</title>

    <!-- Mapbox GL -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <!-- Mapbox Geocoder -->
    <link rel="stylesheet"
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
        type="text/css" />
    <script
        src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>

    <!-- Turf.js (centroid) -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

    <!-- Fuentes y estilos adicionales -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css" rel="stylesheet">
    <script async defer src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js"></script>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="./src/main.css" />
</head>

<body>
    <!-- Contenedor del mapa -->
    <div id="map"></div>

    <!-- Leyenda -->
    <div class="legend-container">
        <div class="legend-title">Catastro Sesquilé<br>Predios Urbanos</div>

        <div class="legend-item">
            <div class="legend-color" style="background:#2ec4b6;"></div>
            <div class="legend-text">Predios</div>
        </div>

        <div class="footer">
            <a style="font-size:9px; color: #00bcd4;">&#9400 EffectiveActions</a>
        </div>
    </div>

    <!-- Caja de información -->
    <div class="info-box">
        <h3>Información del predio</h3>
        <div class="info-content">Busca un predio para ver detalles</div>
    </div>

    <!-- Script JavaScript -->
    <script src="./src/index.js"></script>
</body>

</html>

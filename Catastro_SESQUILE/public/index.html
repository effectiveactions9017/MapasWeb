<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8" />

  <title>Predios Urbanos Sesquilé</title>

  <meta
    name="viewport"
    content="initial-scale=1, maximum-scale=1, user-scalable=no"
  />


  <!-- ============================================= -->
  <!-- MAPBOX CSS -->
  <!-- ============================================= -->

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <script
    src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js">
  </script>


  <!-- ============================================= -->
  <!-- GEOCODER -->
  <!-- ============================================= -->

  <script
    src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js">
  </script>

  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />


  <!-- ============================================= -->
  <!-- TURF.JS -->
  <!-- ============================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js">
  </script>


  <!-- ============================================= -->
  <!-- FUENTES -->
  <!-- ============================================= -->

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  />


  <!-- ============================================= -->
  <!-- MAPBOX ASSEMBLY -->
  <!-- ============================================= -->

  <link
    href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css"
    rel="stylesheet"
  />

  <script
    async
    defer
    src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js">
  </script>


  <!-- ============================================= -->
  <!-- CSS PERSONALIZADO -->
  <!-- ============================================= -->

  <link
    rel="stylesheet"
    href="../src/main.css"
  />

</head>


<body>


  <!-- ============================================= -->
  <!-- CONTENEDOR DEL MAPA -->
  <!-- ============================================= -->

  <div id="map"></div>


  <!-- ============================================= -->
  <!-- LEYENDA -->
  <!-- ============================================= -->

  <div class="legend-container">


    <!-- TÍTULO -->

    <div class="legend-title">

      Predial<br />

      Sesquilé

    </div>


    <!-- ELEMENTOS DE LA LEYENDA -->

    <ul class="legend-list">


      <!-- PREDIOS REGISTRADOS -->

      <li>

        <span
          class="legend-color predios-municipales">
        </span>

        Predios registrados

      </li>


      <!-- PREDIOS SIN REGISTRO R1 -->

      <li>

        <span
          class="legend-color predios-sin-info">
        </span>

        Predios sin registro en R1

      </li>


      <!-- PREDIO SELECCIONADO -->

      <li>

        <span
          class="legend-color predio-seleccionado">
        </span>

        Predio seleccionado

      </li>


    </ul>


    <!-- CRÉDITO -->

    <a
      style="
        font-size:9px;
        color:#00bcd4;
      "
    >

      &#9400; EffectiveActions

    </a>


  </div>


  <!-- ============================================= -->
  <!-- CAJA DE INFORMACIÓN -->
  <!-- ============================================= -->

  <div class="info-box">

    <h3>

      Información del predio

    </h3>


    <div class="info-content">

      Busca un predio para ver detalles

    </div>

  </div>


  <!-- ============================================= -->
  <!-- SCRIPT PRINCIPAL DEL MAPA -->
  <!-- ============================================= -->

  <script
    src="../src/index.js">
  </script>


  <!-- ============================================= -->
  <!-- TERRI MAP BRIDGE -->
  <!-- IMPORTANTE: SOLO SE CARGA UNA VEZ -->
  <!-- ============================================= -->

  <script
    src="../src/terri_map_bridge.js">
  </script>


</body>

</html>

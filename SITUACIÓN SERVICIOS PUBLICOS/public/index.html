<html lang="es">
<head>

  <!-- Turf.js -->

  <!-- CSS personalizado -->

  <!-- ✅ Panel premium + ✅ LISTA CON SWITCHES (como tu ejemplo) -->
  <style>
    body { margin:0; padding:0; font-family:'Libre Franklin', sans-serif; }
    #map { position:absolute; top:0; bottom:0; width:100%; }

    /* Panel */
    .sp-panel{
      position:absolute;
      top:15px;
      right:10px;
      z-index:30;

      width:280px;
      padding:12px 12px 14px 12px;
      border-radius:14px;

      background:rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 18px 40px rgba(0,0,0,0.35);
      color:#fff;
    }

    .sp-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .sp-title{
      font-weight:800;
      font-size:16px;
      letter-spacing:.2px;
      line-height:1.1;
    }

    .sp-close{
      border:0;
      background:rgba(255,255,255,0.10);
      color:#fff;
      width:34px;
      height:34px;
      border-radius:10px;
      font-size:20px;
      line-height:34px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    .sp-close:hover{
      background:rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .sp-help{
      margin-top:10px;
      font-size:12px;
      opacity:.85;
      line-height:1.25;
    }

    /* Botón para re-abrir (cuando cierras el panel) */
    .sp-open{
      position:absolute;
      top:15px;
      right:10px;
      z-index:31;

      display:none;
      border:0;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(0,0,0,0.72);
      color:#fff;
      font-weight:800;
      cursor:pointer;

      border:1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 18px 40px rgba(0,0,0,0.35);
    }
    .sp-open:hover{ background:rgba(0,0,0,0.82); }

    /* ==========================================================
       ✅ LISTA CON SWITCHES (como el ejemplo)
       ========================================================== */
    .sp-toggles{
      margin-top: 2px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(10,10,10,0.35);
    }

    .sp-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;

      padding: 12px 12px;
      cursor:pointer;
      user-select:none;

      background: rgba(0,0,0,0.15);
      transition: background .12s ease, transform .12s ease;
    }
    .sp-row:hover{ background: rgba(255,255,255,0.06); }

    .sp-label{
      font-weight: 800;
      color: #fff;
      letter-spacing: .1px;
    }

    .sp-switch{
      width: 52px;
      height: 26px;
      border-radius: 999px;
      position: relative;
      flex: 0 0 auto;

      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
      transition: background .12s ease, border-color .12s ease;
    }
    .sp-knob{
      position:absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: transform .12s ease;
    }

    .sp-row.is-active .sp-switch{
      background: rgba(0,188,212,0.80);
      border-color: rgba(0,188,212,0.55);
    }
    .sp-row.is-active .sp-knob{
      transform: translateX(26px);
    }

    .sp-sep{
      height:1px;
      background: rgba(255,255,255,0.10);
      margin: 0;
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Predial y Servicios Públicos – Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet"/>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"/>

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />

  <!-- ✅ Panel premium + ✅ LISTA CON SWITCHES + ✅ CHIP DE COLOR por fila -->
  <style>
    body { margin:0; padding:0; font-family:'Libre Franklin', sans-serif; }
    #map { position:absolute; top:0; bottom:0; width:100%; }

    /* Panel (NO se sale de pantalla) */
    .sp-panel{
      position:absolute;
      top:15px;
      right:10px;
      z-index:30;

      width:320px;
      max-width: calc(100vw - 20px);      /* ✅ FIX: nunca se sale horizontal */
      max-height: calc(100vh - 30px);     /* ✅ clave */
      display:flex;
      flex-direction:column;

      padding:12px 12px 14px 12px;
      border-radius:14px;

      background:rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 18px 40px rgba(0,0,0,0.35);
      color:#fff;
      overflow:hidden;                    /* scroll interno abajo */
    }

    .sp-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      flex: 0 0 auto;
    }

    .sp-title{
      font-weight:800;
      font-size:16px;
      letter-spacing:.2px;
      line-height:1.1;
    }

    .sp-close{
      border:0;
      background:rgba(255,255,255,0.10);
      color:#fff;
      width:34px;
      height:34px;
      border-radius:10px;
      font-size:20px;
      line-height:34px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    .sp-close:hover{
      background:rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .sp-help{
      margin-top:10px;
      font-size:12px;
      opacity:.85;
      line-height:1.25;
      flex: 0 0 auto;
    }

    /* Botón para re-abrir */
    .sp-open{
      position:absolute;
      top:15px;
      right:10px;
      z-index:31;

      display:none;
      border:0;
      padding:10px 12px;
      border-radius:12px;
      background:rgba(0,0,0,0.72);
      color:#fff;
      font-weight:800;
      cursor:pointer;

      border:1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:0 18px 40px rgba(0,0,0,0.35);
      max-width: calc(100vw - 20px);      /* ✅ FIX: tampoco se sale */
    }
    .sp-open:hover{ background:rgba(0,0,0,0.82); }

    /* ==========================================================
       ✅ LISTA CON SWITCHES (scroll solo en la lista)
       ========================================================== */
    #spToggleList{
      flex: 1 1 auto;                      /* ✅ ocupa lo disponible */
      min-height: 0;                       /* ✅ FIX CRÍTICO: overflow dentro de flex */
      overflow:auto;                       /* ✅ scroll interno */
      padding-right:6px;
      border-radius:12px;
      overflow-x:hidden;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(10,10,10,0.35);
    }

    /* Scrollbar */
    #spToggleList::-webkit-scrollbar{ width:10px; }
    #spToggleList::-webkit-scrollbar-track{ background:rgba(255,255,255,0.06); border-radius:10px; }
    #spToggleList::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.18); border-radius:10px; }
    #spToggleList::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,0.26); }

    .sp-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;

      padding: 12px 12px;
      cursor:pointer;
      user-select:none;

      background: rgba(0,0,0,0.15);
      transition: background .12s ease;
    }
    .sp-row:hover{ background: rgba(255,255,255,0.06); }

    /* ✅ Lado izquierdo: punto de color + label */
    .sp-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 0;
    }
    .sp-dot{
      width:12px;
      height:12px;
      border-radius:999px;
      background: var(--sp-accent, #00bcd4);
      border:1px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.25);
      flex: 0 0 auto;
    }

    .sp-label{
      font-weight: 800;
      color: #fff;
      letter-spacing: .1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sp-switch{
      width: 52px;
      height: 26px;
      border-radius: 999px;
      position: relative;
      flex: 0 0 auto;

      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
      transition: background .12s ease, border-color .12s ease;
    }
    .sp-knob{
      position:absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: transform .12s ease;
    }

    /* ✅ activo: switch + fila + punto “brilla” con su color */
    .sp-row.is-active{
      background: color-mix(in srgb, var(--sp-accent, #00bcd4) 16%, rgba(0,0,0,0.15));
    }
    .sp-row.is-active .sp-switch{
      background: color-mix(in srgb, var(--sp-accent, #00bcd4) 82%, rgba(255,255,255,0.10));
      border-color: color-mix(in srgb, var(--sp-accent, #00bcd4) 60%, rgba(255,255,255,0.10));
    }
    .sp-row.is-active .sp-knob{
      transform: translateX(26px);
      background: #0b0b0b;
    }
    .sp-row.is-active .sp-dot{
      box-shadow:
        0 0 0 3px rgba(0,0,0,0.25),
        0 0 18px color-mix(in srgb, var(--sp-accent, #00bcd4) 70%, transparent);
    }

    .sp-sep{
      height:1px;
      background: rgba(255,255,255,0.10);
      margin: 0;
    }

    /* Mobile */
    @media (max-width: 520px){
      .sp-panel{ width: 260px; }
    }

    /* ✅ Extra: pantallas bajitas */
    @media (max-height: 540px){
      .sp-panel{ top:10px; max-height: calc(100vh - 20px); }
    }
  </style>
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- ✅ PANEL FILTRO (LISTA CON SWITCHES + COLORES) -->
  <div id="spControl" class="sp-panel">
    <div class="sp-header">
      <div class="sp-title">Servicios públicos — filtro</div>
      <button id="spClose" class="sp-close" title="Cerrar">×</button>
    </div>

    <!-- ✅ Lista fija (no dropdown) -->
    <div id="spToggleList">

      <!-- ALL (sin color específico) -->
      <div class="sp-row is-active" data-layer="L_ALL" style="--sp-accent:#00bcd4;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Ver todos</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-sep"></div>

      <!-- GAS -->
      <div class="sp-row" data-layer="L_GAS_SI" style="--sp-accent:#00d1ff;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Gas: Sí</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-row" data-layer="L_GAS_NO" style="--sp-accent:#ff4d4d;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Gas: No</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-sep"></div>

      <!-- ACUEDUCTO -->
      <div class="sp-row" data-layer="L_ACUEDUCTO_SI" style="--sp-accent:#3b82f6;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Acueducto: Sí</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-row" data-layer="L_ACUEDUCTO_NO" style="--sp-accent:#f59e0b;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Acueducto: No</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-sep"></div>

      <!-- ALC -->
      <div class="sp-row" data-layer="L_ALC_SI" style="--sp-accent:#22c55e;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Alcantarillado: Sí</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-row" data-layer="L_ALC_NO" style="--sp-accent:#06b6d4;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Alcantarillado: No</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-sep"></div>

      <!-- INTERNET -->
      <div class="sp-row" data-layer="L_INTERNET_SI" style="--sp-accent:#a855f7;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Internet: Sí</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-row" data-layer="L_INTERNET_NO" style="--sp-accent:#64748b;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Internet: No</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-sep"></div>

      <!-- BASURAS -->
      <div class="sp-row" data-layer="L_BASURAS_SI" style="--sp-accent:#ef4444;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Basuras: Sí</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>

      <div class="sp-row" data-layer="L_BASURAS_NO" style="--sp-accent:#14b8a6;">
        <div class="sp-left">
          <span class="sp-dot"></span>
          <span class="sp-label">Basuras: No</span>
        </div>
        <span class="sp-switch"><span class="sp-knob"></span></span>
      </div>
    </div>

    <div class="sp-help">
      Activa uno o varios filtros. El punto de color indica qué color corresponde en el mapa.
    </div>
  </div>

  <!-- Botón pequeño para re-abrir -->
  <button id="spOpen" class="sp-open">Filtros</button>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>

  <!-- ✅ Abrir / cerrar panel -->
  <script>
    (function(){
      const panel = document.getElementById('spControl');
      const btnClose = document.getElementById('spClose');
      const btnOpen  = document.getElementById('spOpen');

      if (btnClose && panel && btnOpen){
        btnClose.addEventListener('click', () => {
          panel.style.display = 'none';
          btnOpen.style.display = 'block';
        });

        btnOpen.addEventListener('click', () => {
          panel.style.display = 'block';
          btnOpen.style.display = 'none';
        });
      }
    })();
  </script>

</body>
</html>

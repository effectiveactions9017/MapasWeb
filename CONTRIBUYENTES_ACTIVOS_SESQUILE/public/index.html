<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <title>Contribuyentes y Predios — Sesquilé</title>

  <meta
    name="viewport"
    content="initial-scale=1,maximum-scale=1,user-scalable=no"
  >


  <!-- ============================================== -->
  <!-- MAPBOX -->
  <!-- ============================================== -->

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <script
    src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js">
  </script>


  <!-- ============================================== -->
  <!-- GEOCODER -->
  <!-- ============================================== -->

  <script
    src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js">
  </script>

  <link
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
    rel="stylesheet"
  />


  <!-- ============================================== -->
  <!-- TURF.JS -->
  <!-- ============================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js">
  </script>


  <!-- ============================================== -->
  <!-- FUENTES -->
  <!-- ============================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- ============================================== -->
  <!-- MAPBOX ASSEMBLY -->
  <!-- ============================================== -->

  <link
    href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css"
    rel="stylesheet"
  >

  <script
    async
    defer
    src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js">
  </script>


  <!-- ============================================== -->
  <!-- CSS PERSONALIZADO -->
  <!-- ============================================== -->

  <link
    rel="stylesheet"
    href="../src/main.css"
  />


  <!-- ============================================== -->
  <!-- CSS EXTRA: LEYENDA / CONTROL DE CAPAS -->
  <!-- ============================================== -->

  <style>

    /* ============================================== */
    /* CÍRCULOS DE COLOR */
    /* ============================================== */

    .legend-color {

      display: inline-block;

      width: 12px;

      height: 12px;

      margin-right: 8px;

      vertical-align: middle;

      border:
        1px solid rgba(255,255,255,.85);

      box-sizing:
        border-box;

    }


    /* Persona Natural */

    .persona-natural {

      background:
        #2ec4b6;

      border-radius:
        999px;

    }


    /* Persona Jurídica */

    .persona-juridica {

      background:
        #ff006e;

      border-radius:
        999px;

    }


    /* ============================================== */
    /* CONTROL DE CAPAS */
    /* ============================================== */

    .layer-control {

      position:
        absolute;

      top:
        15px;

      right:
        10px;

      z-index:
        30;

      background:
        rgba(0,0,0,0.75);

      padding:
        12px;

      border-radius:
        10px;

      width:
        250px;

      color:
        #fff;

      font-family:
        'Libre Franklin',
        sans-serif;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,0.35);

      border:
        1px solid
        rgba(255,255,255,0.12);

      backdrop-filter:
        blur(3px);

    }


    /* ============================================== */
    /* GRUPO DE CHECKBOXES */
    /* ============================================== */

    .lc-group {

      display:
        flex;

      flex-direction:
        column;

      gap:
        10px;

    }


    /* ============================================== */
    /* CADA FILA */
    /* ============================================== */

    .lc-item {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      font-size:
        13px;

      line-height:
        1.2;

      user-select:
        none;

      cursor:
        pointer;

    }


    /* ============================================== */
    /* CHECKBOX */
    /* ============================================== */

    .lc-item input {

      transform:
        translateY(1px);

      cursor:
        pointer;

    }

  </style>

</head>


<body>


  <!-- ============================================== -->
  <!-- MAPA -->
  <!-- ============================================== -->

  <div id="map"></div>


  <!-- ============================================== -->
  <!-- CONTROL DE CAPAS -->
  <!-- ============================================== -->
  <!--
       Ya NO tiene:
       - "Filtros de visualización"
       - desplegable "Ver ambos..."
  -->

  <div
    id="layerControl"
    class="layer-control"
  >


    <div class="lc-group">


      <!-- ========================================== -->
      <!-- PERSONA NATURAL -->
      <!-- ========================================== -->

      <label class="lc-item">

        <input
          type="checkbox"
          id="toggle_persona_natural"
          checked
        />


        <span
          class="legend-color persona-natural">
        </span>


        <span>
          Persona natural (puntos)
        </span>

      </label>


      <!-- ========================================== -->
      <!-- PERSONA JURÍDICA -->
      <!-- ========================================== -->

      <label class="lc-item">

        <input
          type="checkbox"
          id="toggle_persona_juridica"
          checked
        />


        <span
          class="legend-color persona-juridica">
        </span>


        <span>
          Persona jurídica (puntos)
        </span>

      </label>


    </div>

  </div>


  <!-- ============================================== -->
  <!-- CAJA DE INFORMACIÓN -->
  <!-- ============================================== -->

  <div class="info-box">

    <h3>
      Información
    </h3>


    <div class="info-content">

      Busca un contribuyente para ver detalles

    </div>

  </div>


  <!-- ============================================== -->
  <!-- SCRIPT PRINCIPAL -->
  <!-- ============================================== -->

  <script
    src="../src/index.js">
  </script>


</body>

</html>

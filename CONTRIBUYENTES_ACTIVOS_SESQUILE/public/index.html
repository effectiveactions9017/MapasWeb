<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Contribuyentes y Predios — Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css" rel="stylesheet" />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Fuentes y estilos adicionales -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css" rel="stylesheet">
  <script async defer src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js"></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />

  <!-- CSS extra para leyenda (punticos + cuadritos) -->
  <style>
    /* Si ya tienes estos estilos en main.css, no pasa nada (se sobreescriben) */
    .legend-color{
      display:inline-block;
      width:12px;
      height:12px;
      margin-right:8px;
      vertical-align:middle;
      border:1px solid rgba(255,255,255,.85);
      box-sizing:border-box;
    }

    /* Cuadritos (polígonos) */
    .predios-base{ background: transparent; border:1px solid #ffffff; }
    .predios-natural{ background:#2ec4b6; border-radius:3px; }
    .predios-juridicos{ background:#ff006e; border-radius:3px; }
    .predio-seleccionado{ background:#ffff00; border-radius:3px; }

    /* Punticos (puntos) */
    .persona-natural{
      background:#2ec4b6;
      border-radius:999px;
    }
    .persona-juridica{
      background:#ff006e;
      border-radius:999px;
    }
  </style>
</head>

<body>

  <!-- CONTENEDOR DEL MAPA -->
  <div id="map"></div>

  <!-- LEYENDA (ACTUALIZADA A 5 CAPAS: base + 2 polígonos + 2 puntos + seleccionado) -->
  <div id="legend" class="legend-container">
    <div class="legend-title">
      Contribuyentes<br>Sesquilé
    </div>

    <ul class="legend-list">
      <li>
        <span class="legend-color predios-base"></span>
        Predios municipio Sesquilé (contorno)
      </li>

      <li>
        <span class="legend-color predios-natural"></span>
        Predios contribuyentes natural
      </li>

      <li>
        <span class="legend-color predios-juridicos"></span>
        Predios contribuyentes jurídicos
      </li>

      <li>
        <span class="legend-color persona-natural"></span>
        Persona natural (puntos)
      </li>

      <li>
        <span class="legend-color persona-juridica"></span>
        Persona jurídica (puntos)
      </li>

      <li>
        <span class="legend-color predio-seleccionado"></span>
        Seleccionado
      </li>
    </ul>

    <a style="font-size:9px; color:#00bcd4;">&#9400 EffectiveActions</a>
  </div>

  <!-- ========================= -->
  <!-- CAJA DE INFORMACIÓN -->
  <!-- (puedes dejarla; si no la usas en JS no molesta) -->
  <!-- ========================= -->
  <div class="info-box">
    <h3>Información</h3>
    <div class="info-content">
      Busca un contribuyente/predio para ver detalles
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>

</body>
</html>

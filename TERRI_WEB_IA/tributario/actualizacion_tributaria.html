<script>

const API_TERRI =
  "https://terri-api.onrender.com";


let resultadoAnalisis = null;

let analisisId = null;


/* ======================================================
   AL CARGAR LA PÁGINA
====================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    consultarEstadoBase();

  }
);


/* ======================================================
   CONSULTAR ESTADO DE POSTGRESQL
====================================================== */

async function consultarEstadoBase() {

  const estadoBase =
    document.getElementById(
      "estadoBase"
    );

  try {

    const respuesta =
      await fetch(
        `${API_TERRI}/tributario/estado`
      );


    if (!respuesta.ok) {

      throw new Error(
        "No fue posible consultar la base maestra."
      );

    }


    const datos =
      await respuesta.json();


    estadoBase.textContent =
      `Base maestra: ${formatearNumero(
        datos.predios_maestro
      )} predios`;


  } catch (error) {

    console.error(
      "Error consultando base maestra:",
      error
    );


    estadoBase.textContent =
      "Base maestra no disponible";

  }

}


/* ======================================================
   ANALIZAR ARCHIVO REAL
====================================================== */

async function analizarArchivoTributario() {

  const archivoInput =
    document.getElementById(
      "archivoTributario"
    );


  const archivo =
    archivoInput.files[0];


  const fechaCorte =
    document.getElementById(
      "fechaCorte"
    ).value;


  const tipo =
    document.getElementById(
      "tipoActualizacion"
    ).value;


  const btnAnalizar =
    document.getElementById(
      "btnAnalizar"
    );


  if (!archivo) {

    mostrarEstado(
      "Selecciona primero un archivo Excel.",
      "error"
    );

    return;

  }


  if (!fechaCorte) {

    mostrarEstado(
      "Selecciona la fecha de corte.",
      "error"
    );

    return;

  }


  if (
    !archivo.name
      .toLowerCase()
      .endsWith(".xlsx")
    &&
    !archivo.name
      .toLowerCase()
      .endsWith(".xls")
  ) {

    mostrarEstado(
      "El archivo debe ser Excel (.xlsx o .xls).",
      "error"
    );

    return;

  }


  /* ----------------------------------------------
     BLOQUEAR BOTÓN
  ---------------------------------------------- */

  btnAnalizar.disabled =
    true;


  btnAnalizar.textContent =
    "⏳ Analizando...";


  mostrarEstado(
    "TERRI+ está leyendo el archivo y cruzando los códigos prediales con la base maestra...",
    "info"
  );


  /* ----------------------------------------------
     CREAR FORM DATA
  ---------------------------------------------- */

  const formData =
    new FormData();


  formData.append(
    "tipo",
    tipo
  );


  formData.append(
    "fecha_corte",
    fechaCorte
  );


  formData.append(
    "archivo",
    archivo
  );


  try {

    /* --------------------------------------------
       ENVIAR AL BACKEND
    -------------------------------------------- */

    const respuesta =
      await fetch(
        `${API_TERRI}/tributario/analizar`,
        {
          method: "POST",
          body: formData
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      let mensaje =
        "No fue posible analizar el archivo.";


      if (datos.detail) {

        mensaje =
          typeof datos.detail === "string"
            ? datos.detail
            : JSON.stringify(
                datos.detail
              );

      }


      throw new Error(
        mensaje
      );

    }


    /* --------------------------------------------
       GUARDAR RESULTADO REAL
    -------------------------------------------- */

    analisisId =
      datos.analisis_id;


    resultadoAnalisis =
      datos;


    mostrarResultadoReal(
      datos
    );


    mostrarNoCruzados(
      datos.no_cruzados || []
    );


    mostrarEstado(
      "✅ Archivo analizado correctamente. Revisa los resultados antes de confirmar la actualización.",
      "ok"
    );


  } catch (error) {

    console.error(
      "Error analizando archivo:",
      error
    );


    limpiarResultados();


    mostrarEstado(
      error.message ||
      "No fue posible conectar con TERRI+.",
      "error"
    );

  } finally {

    btnAnalizar.disabled =
      false;


    btnAnalizar.textContent =
      "🔍 Analizar archivo";

  }

}


/* ======================================================
   MOSTRAR RESULTADOS REALES
====================================================== */

function mostrarResultadoReal(
  datos
) {

  const resumen =
    datos.resumen || {};


  document.getElementById(
    "resRegistros"
  ).textContent =
    formatearNumero(
      resumen.registros_recibidos || 0
    );


  document.getElementById(
    "resUnicos"
  ).textContent =
    formatearNumero(
      resumen.predios_unicos || 0
    );


  document.getElementById(
    "resCruzados"
  ).textContent =
    formatearNumero(
      resumen.predios_cruzados || 0
    );


  document.getElementById(
    "resNoCruzados"
  ).textContent =
    formatearNumero(
      resumen.predios_no_cruzados || 0
    );


  document.getElementById(
    "btnVerNoCruzados"
  ).disabled =
    !resumen.predios_no_cruzados;


  document.getElementById(
    "btnConfirmar"
  ).disabled =
    !datos.analisis_id;

}


/* ======================================================
   MOSTRAR NO CRUZADOS
====================================================== */

function mostrarNoCruzados(
  registros
) {

  const tbody =
    document.getElementById(
      "tablaNoCruzadosBody"
    );


  tbody.innerHTML =
    "";


  registros.forEach(
    registro => {

      const fila =
        document.createElement(
          "tr"
        );


      fila.innerHTML = `

        <td>
          ${escaparHTML(
            registro.numero_predial || ""
          )}
        </td>

        <td>
          ${escaparHTML(
            registro.cedula_nit || ""
          )}
        </td>

        <td>
          ${escaparHTML(
            registro.vigencia ?? ""
          )}
        </td>

        <td>
          ${escaparHTML(
            registro.fecha_pago || ""
          )}
        </td>

      `;


      tbody.appendChild(
        fila
      );

    }
  );

}


/* ======================================================
   VER / OCULTAR NO CRUZADOS
====================================================== */

function alternarNoCruzados() {

  const tabla =
    document.getElementById(
      "tablaNoCruzados"
    );


  tabla.classList.toggle(
    "visible"
  );

}


/* ======================================================
   CONFIRMAR ACTUALIZACIÓN REAL
====================================================== */

async function confirmarActualizacion() {

  if (!analisisId) {

    mostrarEstado(
      "Primero debes analizar correctamente un archivo.",
      "error"
    );

    return;

  }


  const confirmar =
    window.confirm(
      "¿Confirmas que deseas guardar esta actualización tributaria en PostgreSQL?"
    );


  if (!confirmar) {

    return;

  }


  const btnConfirmar =
    document.getElementById(
      "btnConfirmar"
    );


  btnConfirmar.disabled =
    true;


  btnConfirmar.textContent =
    "⏳ Guardando...";


  mostrarEstado(
    "Guardando actualización tributaria en PostgreSQL...",
    "info"
  );


  try {

    const respuesta =
      await fetch(
        `${API_TERRI}/tributario/confirmar/${analisisId}`,
        {
          method: "POST"
        }
      );


    const datos =
      await respuesta.json();


    if (!respuesta.ok) {

      let mensaje =
        "No fue posible guardar la actualización.";


      if (datos.detail) {

        mensaje =
          typeof datos.detail === "string"
            ? datos.detail
            : JSON.stringify(
                datos.detail
              );

      }


      throw new Error(
        mensaje
      );

    }


    mostrarEstado(
      `✅ Actualización guardada correctamente. Registros insertados: ${formatearNumero(
        datos.registros_insertados || 0
      )}.`,
      "ok"
    );


    /* --------------------------------------------
       YA NO PERMITIR CONFIRMAR DE NUEVO
    -------------------------------------------- */

    analisisId =
      null;


    btnConfirmar.disabled =
      true;


    btnConfirmar.textContent =
      "✅ Actualización guardada";


    consultarEstadoBase();


  } catch (error) {

    console.error(
      "Error confirmando actualización:",
      error
    );


    mostrarEstado(
      error.message ||
      "No fue posible guardar la actualización.",
      "error"
    );


    btnConfirmar.disabled =
      false;


    btnConfirmar.textContent =
      "✅ Confirmar actualización";

  }

}


/* ======================================================
   LIMPIAR
====================================================== */

function limpiarFormulario() {

  document.getElementById(
    "archivoTributario"
  ).value =
    "";


  document.getElementById(
    "fechaCorte"
  ).value =
    "";


  resultadoAnalisis =
    null;


  analisisId =
    null;


  limpiarResultados();


  document.getElementById(
    "estadoProceso"
  ).className =
    "estado-proceso";


  document.getElementById(
    "estadoProceso"
  ).textContent =
    "";

}


/* ======================================================
   LIMPIAR RESULTADOS
====================================================== */

function limpiarResultados() {

  document.getElementById(
    "resRegistros"
  ).textContent =
    "-";


  document.getElementById(
    "resUnicos"
  ).textContent =
    "-";


  document.getElementById(
    "resCruzados"
  ).textContent =
    "-";


  document.getElementById(
    "resNoCruzados"
  ).textContent =
    "-";


  document.getElementById(
    "btnVerNoCruzados"
  ).disabled =
    true;


  document.getElementById(
    "btnConfirmar"
  ).disabled =
    true;


  document.getElementById(
    "btnConfirmar"
  ).textContent =
    "✅ Confirmar actualización";


  document.getElementById(
    "tablaNoCruzados"
  ).classList.remove(
    "visible"
  );


  document.getElementById(
    "tablaNoCruzadosBody"
  ).innerHTML =
    "";

}


/* ======================================================
   ESTADO
====================================================== */

function mostrarEstado(
  mensaje,
  tipo
) {

  const estado =
    document.getElementById(
      "estadoProceso"
    );


  estado.className =
    `estado-proceso ${tipo}`;


  estado.textContent =
    mensaje;

}


/* ======================================================
   NÚMEROS
====================================================== */

function formatearNumero(
  valor
) {

  return new Intl
    .NumberFormat(
      "es-CO"
    )
    .format(
      Number(
        valor || 0
      )
    );

}


/* ======================================================
   SEGURIDAD HTML
====================================================== */

function escaparHTML(
  valor
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      valor ?? ""
    );


  return div.innerHTML;

}

</script>

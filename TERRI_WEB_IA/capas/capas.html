<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visualizador de Capas TERRI+</title>


    <!-- =====================================================
         MAPLIBRE GL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    >


    <!-- =====================================================
         ESTILOS TERRI+
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./capas.css"
    >

</head>


<body>

<div class="capas-app">


    <!-- =====================================================
         PANEL LATERAL
    ====================================================== -->

    <aside class="capas-panel">


        <!-- =================================================
             ENCABEZADO DEL VISUALIZADOR
        ================================================== -->

        <div class="panel-header">


            <!-- =============================================
                 LOGO DE CAPAS TERRI+
            ============================================== -->

            <div class="panel-icon">

                <svg
                    viewBox="0 0 64 64"
                    width="34"
                    height="34"
                    aria-hidden="true"
                >

                    <!-- CAPA SUPERIOR -->

                    <polygon
                        points="32,6 55,19 32,32 9,19"
                        fill="#63C990"
                    />


                    <!-- CAPA CENTRAL -->

                    <polygon
                        points="32,20 55,33 32,46 9,33"
                        fill="#3F8ED0"
                    />


                    <!-- CAPA INFERIOR -->

                    <polygon
                        points="32,34 55,47 32,60 9,47"
                        fill="#304E7A"
                    />

                </svg>

            </div>


            <!-- =============================================
                 TÍTULO
            ============================================== -->

            <div>

                <h1>
                    Visualizador de capas
                </h1>

                <p>
                    Carga y explora información territorial.
                </p>

            </div>

        </div>



        <!-- =================================================
             CARGAR CAPA
        ================================================== -->

        <section class="panel-section">

            <h2>
                Agregar información
            </h2>


            <label
                for="archivoCapa"
                class="upload-btn"
            >

                <span class="upload-icon">
                    ＋
                </span>

                <span>
                    Subir capa
                </span>

            </label>


            <input
                id="archivoCapa"
                type="file"
                accept=".geojson,.json,application/geo+json,application/json"
                multiple
            >


            <p class="section-help">
                Formatos iniciales: GeoJSON y JSON.
            </p>

        </section>



        <!-- =================================================
             MAPA BASE
        ================================================== -->

        <section class="panel-section">

            <h2>
                Mapa base
            </h2>


            <select id="selectorMapaBase">

                <option value="osm">
                    OpenStreetMap
                </option>

                <option value="satelite">
                    Imagen satelital
                </option>

            </select>

        </section>



        <!-- =================================================
             CAPAS CARGADAS
        ================================================== -->

        <section class="panel-section capas-section">


            <div class="section-title-row">

                <h2>
                    Capas cargadas
                </h2>


                <span
                    id="contadorCapas"
                    class="contador"
                >
                    0
                </span>

            </div>



            <div
                id="listaCapas"
                class="lista-capas"
            >


                <!-- =========================================
                     ESTADO VACÍO
                ========================================== -->

                <div
                    id="estadoVacio"
                    class="estado-vacio"
                >


                    <!-- LOGO DE CAPAS -->

                    <div class="estado-vacio-icon">

                        <svg
                            viewBox="0 0 64 64"
                            width="42"
                            height="42"
                            aria-hidden="true"
                        >

                            <polygon
                                points="32,6 55,19 32,32 9,19"
                                fill="#63C990"
                            />

                            <polygon
                                points="32,20 55,33 32,46 9,33"
                                fill="#3F8ED0"
                            />

                            <polygon
                                points="32,34 55,47 32,60 9,47"
                                fill="#304E7A"
                            />

                        </svg>

                    </div>


                    <strong>
                        No hay capas cargadas
                    </strong>


                    <span>
                        Usa “Subir capa” para comenzar.
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             ESTADO DEL SISTEMA
        ================================================== -->

        <div
            id="mensajeEstado"
            class="mensaje-estado"
            aria-live="polite"
        ></div>


    </aside>



    <!-- =====================================================
         MAPA
    ====================================================== -->

    <main class="mapa-contenedor">


        <!-- MAPA -->

        <div
            id="map"
            class="mapa"
        ></div>



        <!-- =================================================
             ESTADO DEL MAPA
        ================================================== -->

        <div class="mapa-info">

            <span class="estado-punto"></span>

            <span id="textoEstadoMapa">
                Visualizador listo
            </span>

        </div>


    </main>


</div>



<!-- =========================================================
     MAPLIBRE GL
========================================================== -->

<script
    src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
></script>



<!-- =========================================================
     TERRI+ VISUALIZADOR DE CAPAS
========================================================== -->

<script src="./capas.js"></script>


</body>

</html>

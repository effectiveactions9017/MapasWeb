<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Predial + Recaudo impuesto ICA – Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuente -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />

  <!-- ✅ Estilos de la leyenda (colores actualizados) + Popup/Lightbox -->
  <style>
    /* Predial base (contorno blanco) */
    .legend-color.predios-municipio{
      background:#ffffff;
      border:1px solid rgba(255,255,255,0.9);
    }

    /* ✅ Posibilidades de recaudo del ICA (verde) */
    .legend-color.ica-puntos{
      background:#00c853;
      border:1px solid rgba(255,255,255,0.9);
    }

    /* ✅ Contribuyentes activos (morado: jurídica + natural) */
    .legend-color.contribuyentes-activos{
      background:#ff00ff;
      border:1px solid rgba(255,255,255,0.9);
    }

    /* ✅ Fachadas con letreros encontradas (azul) */
    .legend-color.fachadas-letreros{
      background:#00b0ff;
      border:1px solid rgba(255,255,255,0.9);
    }

    /* ==========================================================
       ✅ POPUP: asegura que se vea completo y no se “corte”
       (sin cambiar tu botón Street View)
       ========================================================== */
    .mapboxgl-popup{
      z-index: 20;
    }
    .mapboxgl-popup-content{
      padding: 0 !important;              /* tu HTML ya maneja padding interno */
      border-radius: 14px !important;
      overflow: hidden !important;
      background: transparent !important; /* deja que tu tarjeta se vea */
      box-shadow: 0 18px 40px rgba(0,0,0,.35) !important;
    }
    .mapboxgl-popup-close-button{
      font-size: 18px !important;
      padding: 6px 10px !important;
      color: #fff !important;
      z-index: 30 !important;
    }

    /* ✅ En móvil, evita que el popup quede gigante/cortado */
    @media (max-width: 640px){
      .mapboxgl-popup{
        max-width: 92vw !important;
      }
      .mapboxgl-popup-content{
        max-width: 92vw !important;
      }
    }

    /* ==========================================================
       ✅ LIGHTBOX (foto ampliada) — por si el z-index pelea con UI
       ========================================================== */
    #ea-lightbox{
      z-index: 99999 !important;
    }
  </style>
</head>

<body>

  <!-- CONTENEDOR DEL MAPA -->
  <div id="map"></div>

  <!-- LEYENDA (ACTUALIZADA) -->
  <div class="legend-container">
    <div class="legend-title">
      Predial<br>Sesquilé
    </div>

    <ul class="legend-list">
      <li>
        <span class="legend-color predios-municipio"></span>
        Predial (base)
      </li>

      <li>
        <span class="legend-color contribuyentes-activos"></span>
        Contribuyentes activos
      </li>

      <li>
        <span class="legend-color ica-puntos"></span>
        Posibilidades de recaudo del ICA
      </li>

      <li>
        <span class="legend-color fachadas-letreros"></span>
        Fachadas con letreros encontradas
      </li>
    </ul>

    <a style="font-size:9px; color:#00bcd4;">&#9400 EffectiveActions</a>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>

</body>
</html>

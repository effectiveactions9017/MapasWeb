<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Predial + Recaudo impuesto ICA – Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuente -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />

  <!-- ✅ Popup/Lightbox + ✅ Leyenda nueva ON/OFF -->
  <style>
    /* ==========================================================
       ✅ POPUP: asegura que se vea completo y no se “corte”
       ========================================================== */
    .mapboxgl-popup{ z-index: 20; }
    .mapboxgl-popup-content{
      padding: 0 !important;
      border-radius: 14px !important;
      overflow: hidden !important;
      background: transparent !important;
      box-shadow: 0 18px 40px rgba(0,0,0,.35) !important;
    }
    .mapboxgl-popup-close-button{
      font-size: 18px !important;
      padding: 6px 10px !important;
      color: #fff !important;
      z-index: 30 !important;
    }

    @media (max-width: 640px){
      .mapboxgl-popup{ max-width: 92vw !important; }
      .mapboxgl-popup-content{ max-width: 92vw !important; }
    }

    /* ✅ LIGHTBOX */
    #ea-lightbox{ z-index: 99999 !important; }

    /* ==========================================================
       ✅ LEYENDA NUEVA (la llena index.js) — ON/OFF
       ========================================================== */
    .ea-legend{
      position:absolute;
      right:12px;
      top:12px;
      z-index: 25;
      width: 240px;
      border-radius: 14px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(6px);
      color:#fff;
      padding: 10px 10px 8px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .ea-legend .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 7px 6px;
      border-radius: 10px;
    }
    .ea-legend .row:hover{
      background: rgba(255,255,255,0.06);
    }

    .ea-legend .left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }

    .ea-legend .dot{
      width:10px; height:10px;
      border-radius:999px;
      border:1.5px solid rgba(255,255,255,0.9);
      flex: 0 0 auto;
    }

    .ea-legend .name{
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .ea-legend input[type="checkbox"]{
      width: 18px;
      height: 18px;
      cursor:pointer;
    }

    .ea-legend .ea-foot{
      margin-top: 8px;
      font-size: 9px;
      color: #00bcd4;
      opacity: .95;
    }
  </style>
</head>

<body>

  <!-- CONTENEDOR DEL MAPA -->
  <div id="map"></div>

  <!-- ✅ CONTENEDOR DE LEYENDA NUEVA (ON/OFF) -->
  <div id="ea-legend" class="ea-legend">
    <!-- index.js lo llena -->
    <div style="opacity:.8;font-size:12px;">Cargando capas…</div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>

</body>
</html>

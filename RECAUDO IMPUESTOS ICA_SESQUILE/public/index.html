<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Predial + Recaudo impuesto ICA – Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuente -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />

  <!-- ✅ Estilos de la leyenda (colores actualizados) -->
  <style>
    /* Predial base (contorno blanco) */
    .legend-color.predios-municipio{
      background:#ffffff;
      border:1px solid rgba(255,255,255,0.9);
    }

    /* ✅ ICA (verde) */
    .legend-color.ica-puntos{
      background:#00c853;
      border:1px solid rgba(255,255,255,0.9);
    }

    /* ✅ Jurídicos (fucsia) */
    .legend-color.juridicos{
      background:#ff00ff;
      border:1px solid rgba(255,255,255,0.9);
    }
  </style>
</head>

<body>

  <!-- CONTENEDOR DEL MAPA -->
  <div id="map"></div>

  <!-- LEYENDA (ACTUALIZADA) -->
  <div class="legend-container">
    <div class="legend-title">
      Predial<br>Sesquilé
    </div>

    <ul class="legend-list">
      <li>
        <span class="legend-color predios-municipio"></span>
        Predial (base)
      </li>

      <li>
        <span class="legend-color juridicos"></span>
        Predios contribuyentes jurídicos
      </li>

      <li>
        <span class="legend-color ica-puntos"></span>
        Recaudo impuesto ICA
      </li>
    </ul>

    <a style="font-size:9px; color:#00bcd4;">&#9400 EffectiveActions</a>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>

</body>
</html>

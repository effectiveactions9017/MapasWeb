<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Predial Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuentes y estilos -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >
  <link
    href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css"
    rel="stylesheet"
  >
  <script async defer src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js"></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- =========================
       LEYENDA
       ========================= -->
  <div class="legend-container">
    <div class="legend-title">
      Predial<br>Sesquilé
    </div>

    <ul class="legend-list">
      <li class="legend-item">
        <div class="legend-item-left">
          <span class="legend-color" style="background:#4fc3f7;"></span>
          <span class="legend-label">Predios públicos</span>
        </div>
        <button class="legend-toggle active" data-category="publicos">ON</button>
      </li>

      <li class="legend-item">
        <div class="legend-item-left">
          <span class="legend-color" style="background:#e63946;"></span>
          <span class="legend-label">Predios con mora</span>
        </div>
        <button class="legend-toggle active" data-category="mora">ON</button>
      </li>

      <li class="legend-item">
        <div class="legend-item-left">
          <span class="legend-color" style="background:#2ec4b6;"></span>
          <span class="legend-label">Predios al día</span>
        </div>
        <button class="legend-toggle active" data-category="aldia">ON</button>
      </li>

      <li class="legend-item">
        <div class="legend-item-left">
          <span class="legend-color" style="background:#d9c80b;"></span>
          <span class="legend-label">Posibles sin pagar</span>
        </div>
        <button class="legend-toggle active" data-category="sinpago">ON</button>
      </li>
    </ul>

    <a class="legend-credit">
      &#9400; EffectiveActions
    </a>
  </div>

  <!-- =========================
       CAJA DE INFORMACIÓN
       ========================= -->
  <div class="info-box">
    <h3>Información del predio</h3>
    <div class="info-content">
      Busca un predio para ver detalles
    </div>
  </div>

  <!-- JS PRINCIPAL -->
  <script src="../src/index.js"></script>

</body>
</html>

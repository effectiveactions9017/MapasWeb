<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Predios Urbanos Sesquilé</title>
  <meta
    name="viewport"
    content="initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuentes -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />
</head>

<body>
  <div id="map"></div>

  <!-- LEYENDA -->
  <div class="legend-container">
    <div class="legend-title">
      Predial<br />
      Sesquilé
    </div>

    <div class="legend-subtitle">
      Categorías de predios
    </div>

    <ul class="legend-list">
      <li class="legend-item">
        <div class="legend-left">
          <span class="legend-color publicos"></span>
          <span class="legend-label">Predios públicos</span>
        </div>
        <button class="legend-toggle active" data-category="publicos" title="Mostrar / ocultar">
          ON
        </button>
      </li>

      <li class="legend-item">
        <div class="legend-left">
          <span class="legend-color mora"></span>
          <span class="legend-label">Predios con mora</span>
        </div>
        <button class="legend-toggle active" data-category="mora" title="Mostrar / ocultar">
          ON
        </button>
      </li>

      <li class="legend-item">
        <div class="legend-left">
          <span class="legend-color aldia"></span>
          <span class="legend-label">Predios al día</span>
        </div>
        <button class="legend-toggle active" data-category="aldia" title="Mostrar / ocultar">
          ON
        </button>
      </li>

      <li class="legend-item">
        <div class="legend-left">
          <span class="legend-color sinpago"></span>
          <span class="legend-label">Posibles predios sin pagar</span>
        </div>
        <button class="legend-toggle active" data-category="sinpago" title="Mostrar / ocultar">
          ON
        </button>
      </li>
    </ul>

    <div class="legend-footer">
      &#9400; EffectiveActions
    </div>
  </div>

  <!-- CAJA DE INFORMACIÓN -->
  <div class="info-box">
    <h3>Información del predio</h3>
    <div class="info-content">
      Busca un predio para ver detalles.
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>
</body>
</html>

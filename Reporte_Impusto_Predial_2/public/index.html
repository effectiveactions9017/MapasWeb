<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor Predial Sesquilé</title>

  <!-- Mapbox -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>

  <!-- Turf -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* Popup */
    .custom-popup .mapboxgl-popup-content {
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    /* Leyenda */
    .legend-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.96);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.16);
      min-width: 260px;
      font-size: 13px;
    }

    .legend-title {
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 14px;
      color: #1b3a4b;
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.2);
    }

    .legend-toggle {
      border: none;
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: #198754;
      color: white;
    }

    .legend-toggle.inactive {
      background: #6c757d;
    }
  </style>
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- LEYENDA -->
  <div class="legend-box">
    <div class="legend-title">Clasificación Predial</div>

    <div class="legend-row">
      <div class="legend-left">
        <span class="legend-color" style="background:#4fc3f7;"></span>
        <span>Predios públicos</span>
      </div>
      <button class="legend-toggle active" data-category="publicos">ON</button>
    </div>

    <div class="legend-row">
      <div class="legend-left">
        <span class="legend-color" style="background:#f77f00;"></span>
        <span>Abono parcial</span>
      </div>
      <button class="legend-toggle active" data-category="abono">ON</button>
    </div>

    <div class="legend-row">
      <div class="legend-left">
        <span class="legend-color" style="background:#e63946;"></span>
        <span>Con mora</span>
      </div>
      <button class="legend-toggle active" data-category="mora">ON</button>
    </div>

    <div class="legend-row">
      <div class="legend-left">
        <span class="legend-color" style="background:#2ec4b6;"></span>
        <span>Al día</span>
      </div>
      <button class="legend-toggle active" data-category="aldia">ON</button>
    </div>

    <div class="legend-row" style="margin-bottom:0;">
      <div class="legend-left">
        <span class="legend-color" style="background:#ffb703;"></span>
        <span>Sin información</span>
      </div>
      <button class="legend-toggle active" data-category="sinpago">ON</button>
    </div>
  </div>

  <!-- TU SCRIPT -->
  <script src="./app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <title>
    Bonos de Carbono - Sesquilé
  </title>

  <meta
    name="viewport"
    content="initial-scale=1,maximum-scale=1,user-scalable=no"
  >


  <!-- ============================================== -->
  <!-- MAPBOX -->
  <!-- ============================================== -->

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <script
    src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js">
  </script>


  <!-- ============================================== -->
  <!-- TURF.JS -->
  <!-- ============================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js">
  </script>


  <!-- ============================================== -->
  <!-- FUENTE -->
  <!-- ============================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- ============================================== -->
  <!-- MAPBOX ASSEMBLY -->
  <!-- ============================================== -->

  <link
    href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css"
    rel="stylesheet"
  >

  <script
    async
    defer
    src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js">
  </script>


  <!-- ============================================== -->
  <!-- CSS PERSONALIZADO -->
  <!-- ============================================== -->

  <link
    rel="stylesheet"
    href="../src/main.css"
  />

</head>


<body>


  <!-- ============================================== -->
  <!-- MAPA -->
  <!-- ============================================== -->

  <div id="map"></div>


  <!-- ============================================== -->
  <!-- LEYENDA -->
  <!-- ============================================== -->

  <div class="legend-container">


    <div class="legend-title">

      Bonos de Carbono
      <br>
      Sesquilé

    </div>


    <ul class="legend-list">


      <!-- ========================================== -->
      <!-- OPORTUNIDAD -->
      <!-- ========================================== -->

      <li>

        <span
          class="legend-color bonos-oportunidad">
        </span>

        <span>
          Oportunidad de bonos de carbono
        </span>

      </li>


      <!-- ========================================== -->
      <!-- PÉRDIDAS -->
      <!-- ========================================== -->

      <li>

        <span
          class="legend-color bonos-perdidas">
        </span>

        <span>
          Pérdidas de bonos de carbono
        </span>

      </li>


      <!-- ========================================== -->
      <!-- LÍMITE MUNICIPAL -->
      <!-- ========================================== -->

      <li>

        <span
          class="legend-line limite-municipal">
        </span>

        <span>
          Límite municipal
        </span>

      </li>


      <!-- ========================================== -->
      <!-- LÍMITE URBANO -->
      <!-- ========================================== -->

      <li>

        <span
          class="legend-line limite-urbano">
        </span>

        <span>
          Límite urbano
        </span>

      </li>


    </ul>


    <!-- ============================================ -->
    <!-- CRÉDITO -->
    <!-- ============================================ -->

    <div class="legend-credit">

      &#9400; EffectiveActions

    </div>


  </div>


  <!-- ============================================== -->
  <!-- CAJA DE INFORMACIÓN -->
  <!-- ============================================== -->

  <div class="info-box">

    <h3>
      Información del polígono
    </h3>

    <div class="info-content">

      Da clic sobre un polígono para ver detalles

    </div>

  </div>


  <!-- ============================================== -->
  <!-- SCRIPT PRINCIPAL -->
  <!-- ============================================== -->

  <script
    src="../src/index.js">
  </script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Predios Urbanos Sesquilé</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet"/>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css" rel="stylesheet"/>

  <!-- Turf -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Mapbox Assembly -->
  <link href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css" rel="stylesheet">
  <script async defer src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js"></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- ========================= -->
  <!-- LEYENDA -->
  <!-- ========================= -->
  <div class="legend-container">
    <div class="legend-title">
      Predial<br>Sesquilé
    </div>

    <ul class="legend-list">

      <!-- 🏛️ MUNICIPIO -->
      <li>
        <span class="legend-color" style="background:#3b82f6;"></span>
        Predios municipales
      </li>

      <!-- 🟢 NORMAL -->
      <li>
        <span class="legend-color" style="background:#2ec4b6;"></span>
        Predios normales
      </li>

      <!-- 🟠 SIN NOMBRE -->
      <li>
        <span class="legend-color" style="background:#ffb703;"></span>
        Sin información
      </li>

      <!-- 🟡 SELECCIONADO -->
      <li>
        <span class="legend-color predio-seleccionado"></span>
        Predio seleccionado
      </li>

    </ul>

    <a style="font-size:9px; color:#00bcd4;">&#9400 EffectiveActions</a>
  </div>

  <!-- ========================= -->
  <!-- INFO BOX -->
  <!-- ========================= -->
  <div class="info-box">
    <h3>Información del predio</h3>
    <div class="info-content">
      Busca un predio para ver detalles
    </div>
  </div>

  <!-- SCRIPT -->
  <script src="../src/index.js"></script>

</body>
</html>

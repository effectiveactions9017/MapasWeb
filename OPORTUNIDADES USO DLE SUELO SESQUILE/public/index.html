<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <title>Destino Económico R1 — Sesquilé</title>

  <meta
    name="viewport"
    content="initial-scale=1,maximum-scale=1,user-scalable=no"
  >


  <!-- MAPBOX -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />

  <script
    src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js">
  </script>


  <!-- GEOCODER -->
  <script
    src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js">
  </script>

  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />


  <!-- TURF -->
  <script
    src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js">
  </script>


  <!-- FUENTE -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- MAPBOX ASSEMBLY -->
  <link
    href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css"
    rel="stylesheet"
  >

  <script
    async
    defer
    src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js">
  </script>


  <!-- CSS PERSONALIZADO -->
  <link
    rel="stylesheet"
    href="../src/main.css"
  />

</head>


<body>


  <!-- ============================================== -->
  <!-- MAPA -->
  <!-- ============================================== -->

  <div id="map"></div>


  <!-- ============================================== -->
  <!-- LEYENDA DESTINO ECONÓMICO -->
  <!-- ============================================== -->

  <div
    class="legend-container"
    id="destino-legend"
  >


    <div class="legend-subtitle">

      Destino económico (R1)

    </div>


    <!-- ============================================ -->
    <!-- BOTONES GENERALES -->
    <!-- ============================================ -->

    <div class="destino-controls">

      <button
        type="button"
        id="destino-all"
      >
        Todos
      </button>


      <button
        type="button"
        id="destino-none"
      >
        Ninguno
      </button>

    </div>


    <!-- ============================================ -->
    <!-- LISTA DE DESTINOS -->
    <!-- ============================================ -->
    <!--
      JavaScript insertará aquí automáticamente:

      ☑ A  — Habitacional
      ☑ D2 — D2
      ☑ L  — Agrícola
      ☑ N  — Agroindustrial
      ☑ O  — Forestal
      ☑ P  — Uso público
      ☑ R  — R
      ☑ Otros / Sin información
    -->

    <div id="destino-legend-list"></div>


    <!-- ============================================ -->
    <!-- CRÉDITO -->
    <!-- ============================================ -->

    <div class="legend-credit">

      &#9400; EffectiveActions

    </div>


  </div>


  <!-- ============================================== -->
  <!-- CAJA DE INFORMACIÓN -->
  <!-- ============================================== -->

  <div class="info-box">

    <h3>
      Información del predio
    </h3>


    <div class="info-content">

      Busca un predio para ver detalles

    </div>

  </div>


  <!-- ============================================== -->
  <!-- JAVASCRIPT PRINCIPAL -->
  <!-- ============================================== -->

  <script
    src="../src/index.js">
  </script>


</body>

</html>

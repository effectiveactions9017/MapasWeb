<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Predios Urbanos Sesquilé</title>
  <meta
    name="viewport"
    content="initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <!-- Mapbox CSS -->
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>

  <!-- Geocoder -->
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
  <link
    rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css"
  />

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>

  <!-- Fuentes y estilos adicionales -->
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.min.css"
    rel="stylesheet"
  />
  <script
    async
    defer
    src="https://api.mapbox.com/mapbox-assembly/v1.5.1/assembly.js"
  ></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="../src/main.css" />
</head>

<body>
  <!-- CONTENEDOR DEL MAPA -->
  <div id="map"></div>

  <!-- LEYENDA -->
  <div class="legend-container">
    <div class="legend-title">
      Estado de pago
    </div>

    <ul class="legend-list">
      <li class="legend-item">
        <input type="checkbox" id="chk_no_dia" checked />
        <span class="legend-color estado-no-dia"></span>
        <span>No está al día</span>
      </li>

      <li class="legend-item">
        <input type="checkbox" id="chk_si_dia" checked />
        <span class="legend-color estado-si-dia"></span>
        <span>Está al día</span>
      </li>

      <li class="legend-item">
        <input type="checkbox" id="chk_activos" checked />
        <span class="legend-color estado-activos"></span>
        <span>Activos públicos</span>
      </li>

      <li class="legend-item">
        <span class="legend-color predios-borde-blanco"></span>
        <span>Predios Sesquilé</span>
      </li>

      <li class="legend-item">
        <span class="legend-color predio-seleccionado"></span>
        <span>Predio seleccionado</span>
      </li>
    </ul>

    <a class="legend-credit">&#9400; EffectiveActions</a>
  </div>

  <!-- CAJA DE INFORMACIÓN -->
  <div class="info-box">
    <h3>Información del predio</h3>
    <div class="info-content">
      Busca un predio para ver detalles
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="../src/index.js"></script>
</body>
</html>
